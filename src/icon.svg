<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0BAB00"/>
      <stop offset="100%" stop-color="#089400"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Fondo redondeado verde Kolbe -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- Escudo blanco -->
  <g filter="url(#shadow)">
    <path d="M 512 180
             L 760 280
             L 760 540
             Q 760 720 512 850
             Q 264 720 264 540
             L 264 280
             Z"
          fill="white" stroke="white" stroke-width="0"/>
  </g>
  <!-- Letra K verde dentro del escudo -->
  <text x="512" y="610"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="380"
        font-weight="900"
        text-anchor="middle"
        fill="#0BAB00">K</text>
  <!-- Texto CDK debajo -->
  <text x="512" y="755"
        font-family="-apple-system, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="70"
        font-weight="800"
        text-anchor="middle"
        fill="#0BAB00"
        letter-spacing="6">CDK</text>
</svg>
