name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # permite lanzarlo manualmente desde la UI de GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Copy web assets
        run: |
          mkdir -p www
          cp -r src/* www/

      - name: Capacitor sync
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CDK-Competiciones-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Job summary
        run: |
          echo "## APK lista para descargar" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "El APK debug se ha generado correctamente." >> $GITHUB_STEP_SUMMARY
          echo "Baja el artifact **CDK-Competiciones-debug-apk** mas arriba en esta misma pagina." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para instalarlo en tu Android: transfierelo al movil, abrelo y autoriza la instalacion desde origenes desconocidos." >> $GITHUB_STEP_SUMMARY
